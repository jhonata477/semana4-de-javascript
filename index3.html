
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco 3 - Eventos JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
            cursor: pointer;
        }

        .feito {
            text-decoration: line-through;
            color: green;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 8px;
        }
    </style>
</head>
<body>

    <h1>Eventos e Event Delegation</h1>

    <h2>1. Eventos do botão</h2>
    <button id="botao">Passe o mouse ou clique</button>

    <h2>2. Digite seu nome</h2>
    <input type="text" id="nome" placeholder="Digite seu nome">

    <h2>3. Lista de tarefas</h2>

    <ul id="lista">
        <li>Estudar JavaScript</li>
        <li>Fazer exercícios</li>
        <li>Revisar o conteúdo</li>
    </ul>

    <h2>4. Adicionar tarefa</h2>

    <form id="formulario">
        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma tarefa"
        >
        <button type="submit">Adicionar tarefa</button>
    </form>

    <script src="script.js">

console.log("===== BLOCO 3: EVENTOS =====");

// 1. Evento de click no botão
const botao = document.querySelector("#botao");

botao.addEventListener("click", function() {
    console.log("Clicou!");
});


// 2. Evento de mouseover
botao.addEventListener("mouseover", function() {
    botao.textContent = "Pode clicar!";
});


// 3. Evento keyup no campo nome
const campoNome = document.querySelector("#nome");

campoNome.addEventListener("keyup", function() {
    console.log(campoNome.value);
});


// 4. Event Delegation na lista
const lista = document.querySelector("#lista");

lista.addEventListener("click", function(e) {
    if (e.target.tagName === "LI") {
        e.target.classList.toggle("feito");

        console.log("Item clicado:", e.target.textContent);
    }
});


// Cria um novo li via JavaScript
const novoItem = document.createElement("li");

novoItem.textContent = "Aprender Event Delegation";

lista.append(novoItem);


// 5. Evento submit do formulário
const formulario = document.querySelector("#formulario");
const campoTarefa = document.querySelector("#tarefa");

formulario.addEventListener("submit", function(e) {
    // Evita que a página seja recarregada
    e.preventDefault();

    // Obtém o texto e remove espaços das extremidades
    const textoTarefa = campoTarefa.value.trim();

    // Não adiciona tarefas vazias
    if (textoTarefa === "") {
        return;
    }

    // Cria um novo item
    const item = document.createElement("li");

    item.textContent = textoTarefa;

    // Adiciona à lista
    lista.append(item);

    // Limpa o campo
    campoTarefa.value = "";
});

    </script>
</body>
</html>
